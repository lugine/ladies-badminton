name: Fix singles save

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken singles injection with standalone version
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('worker.js')
          s=p.read_text()
          start=s.find('/* LB_SINGLES_GAME_V1 */')
          if start < 0:
              raise SystemExit('Singles marker not found; refusing to modify worker.')
          end=s.find('</script>`;', start)
          if end < 0:
              raise SystemExit('Singles block boundary not found; refusing to modify worker.')
          end += len('</script>`;')
          block=r'''/* LB_SINGLES_GAME_V2 */
<style>
#lbSinglesBtn{margin-top:8px}
.lb-singles-row{display:grid;grid-template-columns:1fr 95px;gap:8px;align-items:center;margin:9px 0}
.lb-singles-note{font-size:11px;color:rgba(250,246,237,.62);margin-top:6px}
</style>
<script>
(function(){
  const LB_U='https://zcahhfswtdrdmguppqtp.supabase.co';
  const LB_K='sb_publishable_CeiB5DOuyX7xKdK87tK2QQ_5Y9phmOs';
  const LB_A='a517d9bd-bc9c-4e59-b36d-503747621aa4';
  const LB_DB=window.supabase.createClient(LB_U,LB_K);
  const el=id=>document.getElementById(id);
  const safe=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
  const closeSingles=()=>{const x=el('lbAdminModal');if(x)x.remove()};
  const modalSingles=html=>{let x=el('lbAdminModal');if(!x){x=document.createElement('div');x.id='lbAdminModal';x.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:99999;display:flex;align-items:center;justify-content:center;padding:18px';document.body.appendChild(x)}x.innerHTML='<div style="width:100%;max-width:560px;max-height:90vh;overflow:auto;background:#163A30;border:1px solid rgba(250,246,237,.16);border-radius:14px;padding:20px;color:#FAF6ED">'+html+'</div>';return x};
  async function isAdmin(){const r=await LB_DB.auth.getSession();return r.data?.session?.user?.id===LB_A}
  function weekId(d){const x=new Date(d+'T00:00:00');x.setHours(0,0,0,0);const n=x.getDay();x.setDate(x.getDate()+(n===0?-6:1-n));return x.toISOString().slice(0,10)}
  async function recordSingles(){
    if(!await isAdmin())return alert('Admin login required.');
    const r=await LB_DB.from('players').select('id,name,nickname,active').order('name');
    if(r.error)return alert('Could not load players: '+r.error.message);
    const ps=(r.data||[]).filter(p=>p.active!==false);
    const opts=ps.map(p=>'<option value="'+safe(p.id)+'">'+safe(p.nickname||p.name)+'</option>').join('');
    modalSingles('<h2 style="margin-top:0">🏸 Record Singles Game</h2><div class="muted">Same scoring: play to 21, win by 2, maximum 30.</div><div style="margin-top:12px"><div class="lb-singles-row"><select id="lbSW" class="field">'+opts+'</select><input id="lbSWScore" class="field" type="number" min="21" max="30" step="1" placeholder="Winner score"></div><div class="lb-singles-row"><select id="lbSL" class="field">'+opts+'</select><input id="lbSLScore" class="field" type="number" min="0" max="29" step="1" placeholder="Loser score"></div><div class="lb-singles-note">Choose one different player on each side.</div></div><div style="margin-top:14px"><button id="lbSSave" class="btn gold">Save Singles Game</button><button id="lbSClose" class="btn ghost" style="margin-left:6px">Cancel</button></div>');
    el('lbSClose').onclick=closeSingles;
    el('lbSSave').onclick=async()=>{
      const w=el('lbSW').value,l=el('lbSL').value,ws=Number(el('lbSWScore').value),ls=Number(el('lbSLScore').value);
      if(!w||!l||w===l)return alert('Choose one different player for winner and loser.');
      if(!Number.isInteger(ws)||!Number.isInteger(ls))return alert('Enter whole-number scores.');
      if(ws<21||ws>30||ls<0||ls>=ws)return alert('Winner must score 21–30 and more than the loser.');
      if(ws<30&&ws-ls!==2)return alert('You must win by 2 points.');
      if(ws===30&&ls<28)return alert('At 30, the loser must have at least 28 points.');
      const b=el('lbSSave');b.disabled=true;b.textContent='Saving…';
      const now=new Date();
      const q=await LB_DB.from('games').insert({winners:[w],losers:[l],winner_score:ws,loser_score:ls,played_at:now.toISOString(),week_id:weekId(now.toISOString().slice(0,10))});
      if(q.error){b.disabled=false;b.textContent='Save Singles Game';return alert('Could not save singles game: '+q.error.message)}
      closeSingles();location.reload();
    };
  }
  function install(){const a=el('lbAdminTools');if(!a||el('lbSinglesBtn'))return;const b=document.createElement('button');b.id='lbSinglesBtn';b.className='btn gold';b.type='button';b.textContent='🏸 Record Singles Game';a.appendChild(b);b.onclick=recordSingles}
  setInterval(install,800);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install);else install();
})();
</script>`;'''
          # Preserve everything outside the old block and replace only the broken block.
          s=s[:start]+block+s[end:]
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix singles game save and validation'
          git push
