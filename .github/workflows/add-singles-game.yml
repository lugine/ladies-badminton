name: Add singles game support

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-singles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add singles game support once
        shell: python
        run: |
          from pathlib import Path
          p = Path('worker.js')
          s = p.read_text()
          marker = 'LB_SINGLES_GAME_V1'
          if marker in s:
              print('Singles support already installed; nothing to do.')
              raise SystemExit(0)

          addition = r'''\n/* LB_SINGLES_GAME_V1 */\n<style>\n#lbSinglesBtn{margin-top:8px}\n.lb-singles-row{display:grid;grid-template-columns:1fr 95px;gap:8px;align-items:center;margin:9px 0}\n.lb-singles-note{font-size:11px;color:rgba(250,246,237,.62);margin-top:6px}\n</style>\n<script>\n(function(){\n  async function lbSinglesAdmin(){const r=await db.auth.getSession();return r.data?.session?.user?.id===A}\n  async function lbRecordSingles(){\n    if(!await lbSinglesAdmin()) return alert('Admin login required.');\n    const r=await db.from('players').select('id,name,nickname,active').order('name');\n    if(r.error) return alert('Could not load players: '+r.error.message);\n    const ps=(r.data||[]).filter(p=>p.active!==false);\n    const opts=ps.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.nickname||p.name)+'</option>').join('');\n    modal('<h2 style="margin-top:0">🏸 Record Singles Game</h2><div class="muted">Same scoring rules as doubles: play to 21, win by 2, maximum 30.</div><div style="margin-top:12px"><div class="lb-singles-row"><select id="lbSW" class="field">'+opts+'</select><input id="lbSWScore" class="field" type="number" min="0" max="30" step="1" placeholder="Winner score"></div><div class="lb-singles-row"><select id="lbSL" class="field">'+opts+'</select><input id="lbSLScore" class="field" type="number" min="0" max="30" step="1" placeholder="Loser score"></div><div class="lb-singles-note">The same player cannot be both winner and loser.</div></div><div style="margin-top:14px"><button id="lbSSave" class="btn gold">Save Singles Game</button><button id="lbSClose" class="btn ghost" style="margin-left:6px">Cancel</button></div>');\n    $('lbSClose').onclick=close;\n    $('lbSSave').onclick=async()=>{\n      const w=$('lbSW').value,l=$('lbSL').value,ws=Number($('lbSWScore').value),ls=Number($('lbSLScore').value);\n      if(!w||!l||w===l)return alert('Choose two different players.');\n      if(!Number.isInteger(ws)||!Number.isInteger(ls))return alert('Enter whole-number scores.');\n      if(ws<21||ws>30||ls<0||ls>=ws)return alert('Winner must score 21–30 and more than the loser.');\n      if(ws<22&&ls!==ws-2)return alert('You must win by 2 points.');\n      if(ws===30&&ls<28)return alert('At 30, the loser must have at least 28 points.');\n      const b=$('lbSSave');b.disabled=true;b.textContent='Saving…';\n      const now=new Date();\n      const q=await db.from('games').insert({winners:[w],losers:[l],winner_score:ws,loser_score:ls,played_at:now.toISOString(),week_id:weekId(now.toISOString().slice(0,10))});\n      if(q.error){b.disabled=false;b.textContent='Save Singles Game';return alert('Could not save singles game: '+q.error.message)}\n      close();location.reload();\n    };\n  }\n  function lbInstallSingles(){\n    const adminBox=$('lbAdminTools');\n    if(!adminBox||$('lbSinglesBtn'))return;\n    const b=document.createElement('button');b.id='lbSinglesBtn';b.className='btn gold';b.type='button';b.textContent='🏸 Record Singles Game';adminBox.appendChild(b);b.onclick=lbRecordSingles;\n  }\n  setInterval(lbInstallSingles,800);\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',lbInstallSingles);else lbInstallSingles();\n})();\n</script>\n'''

          # Insert immediately before the closing script tag of the existing injection.
          needle = '</script>`;'
          if needle not in s:
              raise SystemExit('Could not find Worker injection boundary; no changes made.')
          s2 = s.replace(needle, addition + '</script>`;', 1)
          p.write_text(s2)
          print('Singles support inserted.')

      - name: Commit patched worker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- worker.js; then
            echo 'No worker change to commit.'
            exit 0
          fi
          git add -- worker.js
          git commit -m 'Add singles game recording support'
          git push